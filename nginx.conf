server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # WASM must be served as application/wasm for streaming compile.
    location ~ \.wasm$ {
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|ico|svg|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html document; allow embedding in the Nexa app.
    location / {
        add_header Content-Security-Policy "frame-ancestors 'self' https://app.axontract.com;" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}